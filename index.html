<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="description" content="Quality Gate — catálogo de imagens pesquisável por código.">
  <title>Quality Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Quality Gate — início"><span class="brand-mark" aria-hidden="true"><span>Q</span><i></i></span><span class="brand-name">QUALITY <span>GATE</span></span></a>
    <span class="catalog-status"><i></i>CATÁLOGO DE IMAGENS</span>
  </header>
  <main class="app-shell">
    <section class="catalog" aria-labelledby="page-title">
      <div class="page-heading"><div><span class="section-kicker">QUALITY GATE · ACERVO</span><h1 id="page-title">Catálogo de imagens</h1><p>Pesquise pelo código ou nome do arquivo.</p></div><div class="count-badge"><span id="library-count">Carregando…</span></div></div>
      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="search-input">Buscar imagens pelo código ou nome</label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search-input" type="search" placeholder="Digite um código para filtrar…" autocomplete="off" spellcheck="false">
        <button type="button" class="clear-button" id="clear-search" aria-label="Limpar pesquisa" hidden>×</button>
      </form>
      <div class="results-toolbar"><span id="result-caption">Todas as imagens</span><span class="results-hint">Selecione uma imagem para ampliar</span></div>
      <div class="results" id="results" aria-live="polite"></div>
    </section>
  </main>
  <footer class="footer"><span>QUALITY GATE</span><span>CATÁLOGO VERSIONADO NO REPOSITÓRIO</span></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
